services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - runner
      - mongo
    restart: always

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  mongo:
    image: mongo:7
    container_name: online-compiler-mongo
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data: